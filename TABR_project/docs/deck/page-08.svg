<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F5F7FA"/>
  <text x="56" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#10233F">结构性限制：可区分与拥塞互斥</text>
  <text x="56" y="106" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#6B7C8F">这不是调参没调好，而是 all_vehicles_same_scheme 下的系统性质</text>

  <rect x="56" y="132" width="848" height="44" fill="#10233F"/>
  <text x="76" y="160" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E8EEF5">想要</text>
  <text x="330" y="160" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E8EEF5">需要的状态</text>
  <text x="640" y="160" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E8EEF5">副作用</text>

  <rect x="56" y="176" width="848" height="78" fill="#FFFFFF" stroke="#E4EAF0"/>
  <text x="76" y="208" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">策略可区分（G0 ≠ G2）</text>
  <text x="330" y="208" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">base 停在 2–4 Hz，W 不被截平</text>
  <text x="640" y="200" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">全网信标率低 → CBR 0.12–0.18</text>
  <text x="640" y="222" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">信道空闲，所有策略都能按期送达</text>

  <rect x="56" y="254" width="848" height="78" fill="#FFFFFF" stroke="#E4EAF0"/>
  <text x="76" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">信道有压力（超时/漏收）</text>
  <text x="330" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">全网接近 10 Hz</text>
  <text x="640" y="278" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">base 顶到 b_max，W 被 r_max 截平</text>
  <text x="640" y="300" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">四组行为一致，无法比较</text>

  <rect x="56" y="352" width="848" height="100" rx="8" fill="#E7F1F2"/>
  <text x="80" y="380" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0E7C86">为什么这是贡献</text>
  <text x="80" y="404" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">1. 解释了原计划为什么在正式矩阵前就 grid_exhausted：50%–65% 的 CBR 区间在可建密度下达不到。</text>
  <text x="80" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">2. 预测了 v3.2 的结果形态：机制生效（3× 速率差），但只有时延差异、没有超时差异。</text>
  <text x="80" y="444" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">3. 给出下一版设计条件：背景负载与受控速率解耦 → v4（背景定速、目标受控）。</text>

  <text x="56" y="512" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#8A99A8">EIE575 Group 3 · TABR</text>
  <text x="904" y="512" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#8A99A8">8 / 10</text>
</svg>
