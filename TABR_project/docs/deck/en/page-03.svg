<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F5F7FA"/>
  <text x="56" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#10233F">Four schemes, one shared control law</text>
  <text x="56" y="106" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#6B7C8F">Same message format, MAC priority, send timer and logs — only the final multiplier W differs</text>

  <rect x="56" y="140" width="430" height="250" rx="8" fill="#FFFFFF" stroke="#D8E0E8"/>
  <rect x="56" y="140" width="430" height="36" fill="#E7F1F2"/>
  <text x="76" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0E7C86">Scheme</text>
  <text x="170" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0E7C86">Multiplier W</text>
  <text x="330" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0E7C86">Role</text>
  <line x1="56" y1="176" x2="486" y2="176" stroke="#E4EAF0"/>
  <line x1="56" y1="222" x2="486" y2="222" stroke="#E4EAF0"/>
  <line x1="56" y1="268" x2="486" y2="268" stroke="#E4EAF0"/>
  <line x1="56" y1="314" x2="486" y2="314" stroke="#E4EAF0"/>
  <text x="76" y="202" font-family="Segoe UI, sans-serif" font-size="14" fill="#33475B">G0</text>
  <text x="170" y="202" font-family="Segoe UI, sans-serif" font-size="14" fill="#33475B">1</text>
  <text x="330" y="202" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">CBR-feedback baseline</text>
  <text x="76" y="248" font-family="Segoe UI, sans-serif" font-size="14" fill="#33475B">G1</text>
  <text x="170" y="248" font-family="Segoe UI, sans-serif" font-size="14" fill="#33475B">clip(v/33, 1, 3)</text>
  <text x="330" y="248" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">Speed-weighted baseline</text>
  <text x="76" y="294" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0E7C86">G2</text>
  <text x="170" y="294" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0E7C86">1 + 2B</text>
  <text x="330" y="294" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">Protects hard braking</text>
  <text x="76" y="340" font-family="Segoe UI, sans-serif" font-size="14" fill="#33475B">G3</text>
  <text x="170" y="340" font-family="Segoe UI, sans-serif" font-size="14" fill="#33475B">1 + 2·max(B,S)</text>
  <text x="330" y="340" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">Braking + motion change</text>

  <rect x="510" y="140" width="394" height="250" rx="8" fill="#FFFFFF" stroke="#D8E0E8"/>
  <text x="532" y="172" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#10233F">Shared control law (all four)</text>
  <text x="532" y="204" font-family="Consolas, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">Cbar(k) = 0.8·Cbar(k-1) + 0.2·C(k)</text>
  <text x="532" y="230" font-family="Consolas, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">b(k+1) = b(k) + eta·(C_target - Cbar(k))</text>
  <text x="532" y="256" font-family="Consolas, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">r = clip(b·W, 1, 10) Hz</text>
  <text x="532" y="292" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">B = 1 when a_long ≤ -4 m/s²</text>
  <text x="532" y="318" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#33475B">S = clip(motion residual / E_scale, 0, 1)</text>
  <text x="532" y="352" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6B7C8F">Deadband keeps b; the timer never chases backlog,</text>
  <text x="532" y="372" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6B7C8F">one nearest feasible send after a rate change.</text>

  <rect x="56" y="402" width="848" height="68" rx="8" fill="#E7F1F2"/>
  <text x="80" y="430" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#0E7C86">Key limit: r_max = 10 Hz. At the cap, W &gt; 1 is clipped and all schemes look alike.</text>
  <text x="80" y="452" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#0E7C86">β sweep (n=1): delay floors at β ≥ 1 (0.5 ms after detection); usable gain β ≤ r_max/b − 1.</text>

  <text x="56" y="512" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#8A99A8">EIE575 Group 3 · TABR</text>
  <text x="904" y="512" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#8A99A8">3 / 10</text>
</svg>
