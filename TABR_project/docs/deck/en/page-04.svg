<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F5F7FA"/>
  <text x="56" y="76" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#10233F">Platform and four scenarios</text>

  <rect x="56" y="96" width="848" height="40" rx="6" fill="#10233F"/>
  <text x="76" y="121" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" fill="#E8EEF5">OMNeT++ 5.6.2 · Veins 5.0 · SUMO 1.6.0 · 802.11p · 20 mW / 6 Mbps · 250 B / UP 7 · 0.1 s step · 120 s (20 s warm-up)</text>

  <rect x="56" y="156" width="206" height="188" rx="8" fill="#FFFFFF" stroke="#D8E0E8"/>
  <rect x="56" y="156" width="206" height="5" rx="2" fill="#0E7C86"/>
  <text x="76" y="192" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#0E7C86">S0</text>
  <text x="76" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10233F">Known stationary queue</text>
  <text x="76" y="248" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">All four get the same prior;</text>
  <text x="76" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">the queue stays still</text>
  <text x="76" y="296" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#6B7C8F">Estimation error / update cost</text>

  <rect x="274" y="156" width="206" height="188" rx="8" fill="#FFFFFF" stroke="#D8E0E8"/>
  <rect x="274" y="156" width="206" height="5" rx="2" fill="#C2710C"/>
  <text x="294" y="192" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#C2710C">S1</text>
  <text x="294" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10233F">Sudden braking (main)</text>
  <text x="294" y="248" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">80 km/h, −6 m/s²,</text>
  <text x="294" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">25 m gap, event at 20 s</text>
  <text x="294" y="296" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#6B7C8F">D_info / timeout / loss</text>

  <rect x="492" y="156" width="206" height="188" rx="8" fill="#FFFFFF" stroke="#D8E0E8"/>
  <rect x="492" y="156" width="206" height="5" rx="2" fill="#5B3FA8"/>
  <text x="512" y="192" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#5B3FA8">S2</text>
  <text x="512" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10233F">Synchronised braking</text>
  <text x="512" y="248" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">Four target cars brake</text>
  <text x="512" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">together — stress test</text>
  <text x="512" y="296" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#6B7C8F">CBR peak / recovery</text>

  <rect x="710" y="156" width="194" height="188" rx="8" fill="#FFFFFF" stroke="#D8E0E8"/>
  <rect x="710" y="156" width="194" height="5" rx="2" fill="#4A5B6E"/>
  <text x="730" y="192" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#4A5B6E">E0</text>
  <text x="730" y="218" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#10233F">No-brake calibration</text>
  <text x="730" y="248" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">Sets low / high</text>
  <text x="730" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">background load</text>
  <text x="730" y="296" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#6B7C8F">CBR / control share</text>

  <rect x="56" y="366" width="848" height="86" rx="8" fill="#E7F1F2"/>
  <text x="80" y="394" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0E7C86">Statistics</text>
  <text x="80" y="420" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">Five seeds per block, seed-paired; packets, pairs and in-run events are not independent.</text>
  <text x="80" y="442" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#33475B">Deadline 0.8 s, observation 2 s; timeouts and right-censoring counted apart; S0 delay is N/A.</text>

  <text x="56" y="512" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#8A99A8">EIE575 Group 3 · TABR</text>
  <text x="904" y="512" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#8A99A8">4 / 10</text>
