[General]
network = tabr.ResearchHighway
sim-time-limit = 30s
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 5s
**.cmdenv-log-level = warn
debug-on-errors = false
print-undisposed = false
**.scalar-recording = true
**.vector-recording = false

*.playgroundSizeX = 3200m
*.playgroundSizeY = 1000m
*.playgroundSizeZ = 50m
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.annotations.draw = false

# Preserve the working Lab2 radio settings; use one channel for CBR.
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -89dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -110dBm
*.**.nic.phy80211p.decider = xmldoc("radio.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("radio.xml")
*.**.nic.phy80211p.usePropagationDelay = true

*.manager.updateInterval = 0.1s
*.manager.host = "127.0.0.1"
*.manager.port = 9999
*.manager.autoShutdown = false
*.manager.launchConfig = xmldoc("generated/s1.launchd.xml")

*.node[*].applType = "tabr.TabrApp"
*.node[*].appl.headerLength = 80bit
*.node[*].appl.beaconUserPriority = 7
*.node[*].appl.outputDir = "${resultdir}"
*.node[*].appl.runId = "${runid}"
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 1.895
*.node[*].veinsmobility.setHostSpeed = true
*.node[*].veinsmobility.accidentCount = 0

*.brakeScenario.outputDir = "${resultdir}"
*.brakeScenario.runId = "${runid}"

[Config G0]
description = "CBR-only baseline, two-car S1 smoke scenario"
*.node[*].appl.scheme = "G0"

[Config G1]
description = "Common CBR plus bounded v/33-km/h frequency weight"
*.node[*].appl.scheme = "G1"

[Config G2]
description = "CBR plus measured braking flag"
*.node[*].appl.scheme = "G2"

[Config G3]
description = "CBR plus braking flag and fixed-horizon innovation"
*.node[*].appl.scheme = "G3"
